plugins {
    id 'java'
    id 'maven-publish'
    id 'com.enonic.xp.app'
    id "com.github.node-gradle.node" version "7.1.0"
    id 'org.ajoberstar.grgit' version '4.1.1'
    id "com.github.ben-manes.versions" version '0.53.0'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = "${group}"
            artifactId = "${projectName}"
            version = "${version}"

            from components.java
        }
    }
}

ext {
    deployDir = "../deploy/"
}

// ##
// ## Application tasks
// ##
tasks.named("compileTestJava") {
    dependsOn(":npmBuild")
}

tasks.named("jar") {
    dependsOn(":npmBuild")
}

task frontend {
    dependsOn(':frontend:build')
    inputs.dir 'src/frontend/'
    outputs.dir "$buildDir/resources/main"
}

task packageApplication {
    dependsOn(':build')
    group 'application'
    description 'Packages entire application'
}


// ##
// ## npm tasks
// ##
task npmBuild(
        type: NpmTask,
        group: 'node',
        dependsOn: ['installWithCI', 'npmLint'],
        description: 'Build javascript'
) {
    args = ['run', 'build']

    inputs.dir 'src/main/resources'
    outputs.dir "$buildDir/resources/main"
}

task npmDev(
        type: NpmTask,
        group: 'node',
        dependsOn: 'installWithCI',
        description: 'Build and watch backend and frontend resources'
    ) {
    args = ['run', 'dev']
}

task npmTest(
        type: NpmTask,
        group: 'node',
        dependsOn: 'npmBuild',
        description: 'Run javascript tests'
    ) {
    inputs.dir 'src'
    outputs.dir "$buildDir/test-results"
    args = ['run', 'test']
}
rootProject.tasks.getByName("test").dependsOn npmTest

task npmLint(
        type: NpmTask,
        group: 'node',
        dependsOn: ['installWithCI', 'frontend'],
        description: 'Run lint'
) {
    inputs.dir 'src/main'
    outputs.dir "$buildDir/lint-results"
    args = ['run', 'lint']
}

task npmWatch(
        type: NpmTask,
        group: 'node',
        dependsOn: 'npmBuild',
        description: 'Run watch'
) {
    args = ['run', 'watch']
}

task installWithCI(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies with ci, ignoring scripts'
) {
    inputs.files "package.json"
    outputs.dir "./node_modules"
    args = ['ci', '--ignore-scripts', '--quiet']
}

task npm_install(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies, ignoring scripts'
) {
    args = ['install', '--ignore-scripts', '--quiet']
}

task appName {
    group 'application'
    description 'Get the name of the application from gradle.properties'
    doLast {
        print "${projectName}".replaceAll(/[^a-zA-Z]/, "");
    }
}

task appVersion {
    group 'application'
    description 'Get the version of the application from gradle.properties'
    doLast {
        print "${version}"
    }
}

task enonicVersion {
    group 'application'
    description 'Get the enonic XP version from gradle.properties'
    doLast {
        print "${xpVersion}"
    }
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    include xplibs.content
    include xplibs.context
    include xplibs.i18n
    include xplibs.portal
    testImplementation "com.enonic.xp:testing:${xpVersion}"
    include "com.enonic.lib:lib-cache:3.0.0"
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
    maven { url 'https://jitpack.io' } // Needed by freemarker
}


node {
    version = '16.20.2'
    npmVersion = '8.19.4'
    download = true
}
